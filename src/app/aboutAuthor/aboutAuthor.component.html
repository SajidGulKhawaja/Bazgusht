<div class="about-author-page" dir="rtl">
  <main class="main-content">
    <!-- Page Header -->
    <header class="app-header">
      <h1 class="site-title">مصنف کا تعارف</h1>
      <hr class="header-divider" />
    </header>

    <section *ngIf="author && !isLoading" class="author-section">
      <img [src]="author.photo" [alt]="author.name" class="author-photo" />
            
      <div class="author-bio" *ngFor="let paragraph of author.bio">
        <p>{{ paragraph }}</p>
      </div>
    </section>


    <section *ngIf="isLoading" class="loading-text">
      <p>لوڈ ہو رہا ہے...</p>
    </section>
  </main>
</div>
